services:
  - type: web
    name: shakyry
    runtime: static
    # Without an explicit build command Render installs the dependencies and
    # stops, leaving nothing to serve — the repo holds sources, not a built site.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite 8 requires Node ^20.19 || >=22.12; older Render defaults fail the
      # build with a version error before it ever reaches the app code.
      - key: NODE_VERSION
        value: "22.12.0"
      # puppeteer is a devDependency used only by the scripts in tools/.
      # Skip its Chromium download so the build stays fast.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"

    # No routes on purpose.
    #
    # This used to carry rewrites for /_next, /fonts, /sounds and /uploads,
    # because the demos asked our origin for their lazy Next.js chunks and got a
    # 404. That is fixed at the source now: tools/set_asset_prefix.mjs points
    # those requests back at the vendor, and the fonts are vendored into
    # public/fonts. All 174 demos render on a plain static server with no rules
    # at all — verified with tools/serve_static.mjs + tools/verify_demos.mjs.
    #
    # An SPA catch-all (/* -> /index.html) would be actively harmful: six
    # templates have no demo, and the fallback would answer with the whole
    # catalog rendered inside the preview iframe.
